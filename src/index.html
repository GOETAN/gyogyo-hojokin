<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>補助金あんない</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="btn btn-tel-mini" href="tel:{{tel}}" aria-label="漁協に電話する {{phone}}">漁協に電話する</a>
  </header>

  <main id="main">
    <section id="screen-top" class="screen stack" aria-labelledby="top-title">
      <h1 id="top-title" tabindex="-1">あなたに関係ありそうな <ruby>補助金<rt>ほじょきん</rt></ruby>を さがします</h1>
      <p>{{question_count}}つの しつもんに、ボタンを おして こたえるだけです。</p>
      <a class="btn btn-primary" href="#q1">はじめる</a>
      <p class="note">このサイトは ご案内です。使えるかどうかは、漁協に そうだんして ください。</p>
      <noscript><p class="note">この画面は うごきません。下の ボタンから 漁協に 電話して ください。</p></noscript>
    </section>

{{{questions}}}

    <section id="screen-result" class="screen stack" hidden aria-labelledby="result-title">
      <h1 id="result-title" tabindex="-1">けっか</h1>
      <p>（この画面は じゅんびちゅうです）</p>
      <a class="btn btn-secondary" data-back href="#top">もどる</a>
    </section>
  </main>

  <nav class="actions stack" aria-label="いつでも使えるボタン">
    <a class="btn btn-tel" href="tel:{{tel}}">
      <span>漁協に電話する</span>
      <span class="btn-sub">{{phone}}</span>
    </a>
    <p class="hours">{{kumiai_name}}<br>受付 {{hours}}</p>
    <a class="btn btn-secondary" href="./" data-restart hidden>最初からやりなおす</a>
  </nav>
</div>
</body>
</html>
