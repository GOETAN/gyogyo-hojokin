name: validate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
